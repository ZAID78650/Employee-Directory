# ==============================================================================
# Role R4: Prometheus Scrape Configuration
# Scrapes metrics from employee directory app on port 5001 every 5s
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'employee-directory-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:5001']
        labels:
          environment: 'production'
          tier: 'backend-api'
          role: 'R4-deployment'
